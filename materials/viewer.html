<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教學教材 — Cabbage</title><link rel="stylesheet" href="../style.css?v=20261031-cabbage"><style>[hidden]{display:none!important}main{padding-block:32px}iframe{width:100%;height:78vh;border:1px solid #d9ddd3;margin-top:24px}.viewer-actions{display:flex;align-items:center;gap:24px;flex-wrap:wrap}#status{color:#62675f}button{font:inherit;cursor:pointer;border:0}h1{font-size:36px;margin-top:24px}</style></head>
<body><main class="wrap"><a class="text-link" href="../index.html#materials">← 回到教學教材</a><h1 id="title">教學教材</h1><p id="status" role="status" aria-live="polite">正在載入 PDF，請稍候…</p><p id="public-note" hidden>此公開版本已移除 GitHub 存取權杖；程式範例中的憑證請自行填入。</p><div class="viewer-actions"><a id="download" class="button" hidden>下載 PDF ↓</a><a id="open" class="text-link" target="_blank" rel="noopener" hidden>在新分頁閱讀 ↗</a><button id="retry" class="button" hidden>重新載入</button></div><iframe id="pdf" title="PDF 教材閱讀器" hidden></iframe></main>
<script>
const docs={cpp:{name:'C++',file:'cpp.pdf',parts:19,size:19429651},iot:{name:'物聯網',file:'iot-public.pdf',parts:35,size:36004006}};
const params=new URLSearchParams(location.search),doc=docs[params.get('doc')];
const status=document.getElementById('status'),frame=document.getElementById('pdf'),download=document.getElementById('download'),open=document.getElementById('open'),retry=document.getElementById('retry');
retry.addEventListener('click',()=>location.reload());
if(!doc){status.textContent='找不到這份教材，請返回教材清單。';}else{
if(params.get('doc')==='iot'){document.getElementById('public-note').hidden=false;}document.getElementById('title').textContent=doc.name;document.title=doc.name+' 教材 — Cabbage';
(async()=>{try{let completed=0;const buffers=new Array(doc.parts);let next=0;async function worker(){while(next<doc.parts){const i=next++;const response=await fetch('parts/'+doc.file+'.'+String(i).padStart(3,'0'));if(!response.ok)throw Error('HTTP '+response.status);buffers[i]=await response.arrayBuffer();status.textContent='正在載入 PDF：'+(++completed)+' / '+doc.parts;}}await Promise.all(Array.from({length:4},worker));const blob=new Blob(buffers,{type:'application/pdf'});if(blob.size!==doc.size)throw Error('檔案大小不符');const url=URL.createObjectURL(blob);download.href=url;download.download=doc.file;download.hidden=false;open.href=url;open.hidden=false;frame.src=url;frame.hidden=false;status.textContent='PDF 已載入，可線上閱讀或下載原始檔案。若閱讀器未顯示，請使用下載或新分頁閱讀。';if(params.get('download')==='1')download.click();}catch(error){status.textContent='教材載入失敗，請重試或稍後再開啟。';retry.hidden=false;}})();
}
</script></body></html>
